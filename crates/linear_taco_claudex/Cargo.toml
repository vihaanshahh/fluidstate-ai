[package]
name = "linear_taco_claudex"
authors = ["Linear Taco"]
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
rusqlite = { version = "0.35", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "sync", "time", "macros"] }
tracing.workspace = true
which = "8"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread", "test-util"] }
